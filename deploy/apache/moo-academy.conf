# Final HTTP + HTTPS site: enable only after the certificate exists.
# Use the same path as in the bootstrap HTTP configuration.
Define MOO_ACADEMY_ROOT "/home/ubuntu/moo-academy/dist"

<VirtualHost *:80>
    ServerName moo.mudverse.com
    Alias /.well-known/acme-challenge/ /var/lib/letsencrypt/.well-known/acme-challenge/
    <Directory "/var/lib/letsencrypt/.well-known/acme-challenge">
        Options None
        AllowOverride None
        Require all granted
        ForceType text/plain
    </Directory>

    RewriteEngine On
    RewriteRule ^/?\.well-known/acme-challenge/ - [END]
    RewriteCond %{THE_REQUEST} "\s/+index\.html[?\s]"
    RewriteRule ^/?index\.html$ https://moo.mudverse.com/ [R=301,L]
    RewriteRule ^ https://moo.mudverse.com%{REQUEST_URI} [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/moo-academy-http-error.log
    CustomLog ${APACHE_LOG_DIR}/moo-academy-http-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName moo.mudverse.com
    SSLEngine On
    SSLCertificateFile /etc/letsencrypt/live/moo.mudverse.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/moo.mudverse.com/privkey.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    Include /etc/apache2/conf-available/moo-academy-static.inc
    RewriteEngine On
    # THE_REQUEST excludes internal DirectoryIndex lookups, avoiding a loop at /.
    RewriteCond %{THE_REQUEST} "\s/+index\.html[?\s]"
    RewriteRule ^/?index\.html$ https://moo.mudverse.com/ [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/moo-academy-error.log
    CustomLog ${APACHE_LOG_DIR}/moo-academy-access.log combined
</VirtualHost>
